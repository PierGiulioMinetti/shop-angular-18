<div class="tabella">
  <div class="header">
    <h2 class="title">
      Shop Angular
    </h2>
    <div>
      cart
    </div>
  </div>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="Name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.title}} </td>
    </ng-container>

    <ng-container matColumnDef="Category">
      <th mat-header-cell *matHeaderCellDef> Category </th>
      <td mat-cell *matCellDef="let element"> {{element.category.name}} </td>
    </ng-container>

    <ng-container matColumnDef="Price">
      <th mat-header-cell *matHeaderCellDef> Price </th>
      <td mat-cell *matCellDef="let element"> {{element.price}} </td>
    </ng-container>

    <ng-container matColumnDef="Image">
      <div>
        <th mat-header-cell *matHeaderCellDef class="text-center"> Image </th>
        <td mat-cell *matCellDef="let element">
          <div>
            <img width="200px" [src]="element.images[0]" alt="">
          </div>
        </td>
      </div>
    </ng-container>

    <ng-container matColumnDef="Action">
      <th mat-header-cell *matHeaderCellDef class="text-center"> Action </th>
      <td mat-cell *matCellDef="let element">
        <div class="action-buttons margin-auto">
              <div class="example-button-row action-buttons">
                <button mat-flat-button (click)="openDetail(element.id)" color="primary">
                  View Detail
                </button>
                <button mat-flat-button  color="accent">
                  Add to Cart
                </button>
                <!-- <button mat-flat-button  color="warn">Delete Product</button> -->
              </div>
          </div>
      </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
